<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
</head>

<body>
  <div id="backgroundColor"></div>
  <nav id="navigationBar"></nav>

  <div id="loadingContainer">
    <div id="loadingBackground">
        <span id="loading"></span>
        <span id="loadingText">Please wait</span>
    </div>
  </div>
  <div id="outerProfileBox">
    <div id="profileBox">
      <a href="#profile">Profile</a>
      <a href="#address">Address</a>
      <a href="#change_password">Change Password</a>
      <a href="#order_history">Order Status</a>
    </div>
    <div id="outerMenu">
      <div id="profileMenu">
        <div id="displayMenu">
          <svg id="menuBtn" onclick="menuBtnClicked()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
            <path
              d="M96 160C96 142.3 110.3 128 128 128L512 128C529.7 128 544 142.3 544 160C544 177.7 529.7 192 512 192L128 192C110.3 192 96 177.7 96 160zM96 320C96 302.3 110.3 288 128 288L512 288C529.7 288 544 302.3 544 320C544 337.7 529.7 352 512 352L128 352C110.3 352 96 337.7 96 320zM544 480C544 497.7 529.7 512 512 512L128 512C110.3 512 96 497.7 96 480C96 462.3 110.3 448 128 448L512 448C529.7 448 544 462.3 544 480z" />
          </svg>
          <div id="parentProfileH">
            <h1 id="displayCurrentPage">Profile</h1>
          </div>
        </div>
        <hr />
        <div class="menuChilds" id="profilePageChild" hidden></div>
        <div class="menuChilds" id="addressPageChild" hidden></div>
        <div class="menuChilds" id="change_passwordPageChild" hidden></div>
        <div class="menuChilds" id="order_historyPageChild" hidden></div>
      </div>
    </div>
  </div>
  <button onclick="logout()" id="logoutBtn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
      <path
        d="M224 160C241.7 160 256 145.7 256 128C256 110.3 241.7 96 224 96L160 96C107 96 64 139 64 192L64 448C64 501 107 544 160 544L224 544C241.7 544 256 529.7 256 512C256 494.3 241.7 480 224 480L160 480C142.3 480 128 465.7 128 448L128 192C128 174.3 142.3 160 160 160L224 160zM566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L438.6 169.3C426.1 156.8 405.8 156.8 393.3 169.3C380.8 181.8 380.8 202.1 393.3 214.6L466.7 288L256 288C238.3 288 224 302.3 224 320C224 337.7 238.3 352 256 352L466.7 352L393.3 425.4C380.8 437.9 380.8 458.2 393.3 470.7C405.8 483.2 426.1 483.2 438.6 470.7L566.6 342.7z" />
    </svg>
    <p>Logout</p>
  </button>



  <script src="account.js"></script>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100vw;
      min-height: 100vh;
    }

    html {
      font-size: 6px;
    }

    body {
      font-size: 2.6rem;
    }

    #backgroundColor {
      position: fixed;
      width: 100vw;
      height: 100vh;
      z-index: -5;
      background: linear-gradient(to right, #d7d7ff, #9292ff);
    }

    #navigationBar {
      position: absolute;
      width: 100vw;
      height: 70px;
      background-color: #afccec;
      display: flex;
      align-items: center;
    }


    #outerProfileBox {
      padding-top: 70px;
      width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: row;
    }

    #profileBox {
      width: clamp(200px, 50vw, 300px);
      min-height: 100%;
      border-right: 2px solid rgb(94, 170, 174);
      box-shadow: 0px 0px 15px rgb(106, 176, 180);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 80px;
      transition: transform 0.1s ease;
    }

    #profileBox a {
      width: 170px;
      height: 30px;
      padding-left: 20px;
      text-align: left;
      color: black;
      text-decoration-line: none;
    }

    @media screen and (width <=605px) {
      #profileBox {
        position: absolute;
        background-color: rgb(244, 250, 250);
        width: 220px;
        transform: translate(-220px);
      }

      #displayMenu h1 {
        align-items: center;
        text-align: center;
      }
    }

    @media screen and (width >=606px) {
      #menuBtn {
        display: none;
      }
    }

    #menuBtn {
      width: 40px;
      height: 40px;
      cursor: pointer;
      z-index: 1;
    }

    #outerMenu {
      width: 100vw;
      height: 100%;
    }

    #profileMenu {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    #displayMenu {
      width: 100%;
      height: 100px;
      padding: 30px;
      padding-left: 80px;
      display: flex;
      flex-direction: row;
      padding: 0;
    }

    #parentProfileH {
      width: 100%;
      height: 100%;
      padding-left: 50px;
      padding-right: 50px;
      align-content: center;
    }

    #displayMenu h1 {
      width: 100%;
      align-content: center;
    }

    #profileMenu hr {
      align-self: center;
      width: 90%;
      background-color: grey;
    }

    .menuChilds {
      width: 100%;
      height: 100%;
    }

    #logoutBtn {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      width: 80px;
      height: 50px;
      border-radius: 6px;
      background-color: rgb(255, 115, 0);
    }

    #logoutBtn p {
      font-size: 1.5rem;
      font-weight: bold;
    }

    #logoutBtn svg {
      width: 4rem;
      height: 4rem;
      margin: 0;
      padding: 0;
    }

    #loadingContainer {
    position: fixed;
    width: 100vw;
    height: 100vh;
    background-color: rgba(208, 208, 208, 0.657);
    justify-items: center;
    align-content: center;
    display: none;
}
#loadingBackground {
    width: 300px;
    height: 200px;
    background-color: rgba(0, 0, 0, 0.653);
    border-radius: 35px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
#loading {
    border: 2px solid white;
    border-radius: 100%;
    width: 50px;
    height: 50px;
    border-color: transparent;
    border-top-color: grey;
    animation: loadingRotate 1s ease infinite;
}
@keyframes loadingRotate {
    0% {
        transform: rotate(0deg);
    }
    100% {
        transform: rotate(360deg);
    }
}
#loadingText {
    color: white;
    font-family: 'Arial';
}

    @media screen and (width>=576px) {}

    /*  My phone landscape  */
    @media screen and (width>=768px) {}

    /*  My phone portrait  */
    @media screen and (orientation: portrait) and (width>=768px) {}

    /* usually tablets*/
    @media screen and (width>=992px) {}

    /*  My laptop  */
    @media screen and (width>=1200px) {}
  </style>
</body>
</html>
