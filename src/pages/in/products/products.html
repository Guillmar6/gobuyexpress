<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products</title>
</head>

<body>
  <div id="backgroundColor"></div>
  <nav id="navigationBar"></nav>

  <div id="loadingContainer">
    <div id="loadingBackground">
        <span id="loading"></span>
        <span id="loadingText">Please wait</span>
    </div>
  </div>
  <div id="bannerContainer">
    <img id="bannerImg" alt="Banner">
  </div>

  <div id="container"></div>

  <script src="products.js"></script>
  <style>
    *,
    *::before,
    *::after {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html {
      font-size: 6px;
      width: 100vw;
    }

    body {
      font-size: 2.6rem;
      width: 100vw;
      height: auto;
    }

    body::-webkit-scrollbar {
      display: none;
    }

    #backgroundColor {
      position: fixed;
      width: 100vw;
      height: 100vh;
      z-index: -5;
      background: linear-gradient(to right, #d7d7ff, #9292ff);
    }

    #bannerContainer {
      width: 100vw;
      height: auto;
      padding-top: 70px;
      display: flex;
      justify-content: center;
    }
    #bannerContainer img {
      width: 90vw;
      max-width: 900px;
      height: auto;
      margin-top: 30px;
    }
    #container {
      margin-top: 100px;
      padding-left: 5vw;
      padding-right: 5vw;
      width: 100vw;
      height: auto;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-around;
      margin-bottom: 100px;
    }

    #loadingContainer {
      position: fixed;
      width: 100vw;
      height: 100vh;
      background-color: rgba(208, 208, 208, 0.657);
      justify-items: center;
      align-content: center;
      z-index: 5;
      display: none;
    }
    #loadingBackground {
      width: 300px;
      height: 200px;
      background-color: rgba(0, 0, 0, 0.653);
      border-radius: 35px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #loading {
      border: 2px solid white;
      border-radius: 100%;
      width: 50px;
      height: 50px;
      border-color: transparent;
      border-top-color: grey;
      animation: loadingRotate 1s ease infinite;
    }
    @keyframes loadingRotate {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
    #loadingText {
      color: white;
      font-family: 'Arial';
    }
  </style>
</body>

</html>
