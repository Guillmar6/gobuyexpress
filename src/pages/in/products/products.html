<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products</title>
</head>

<body>
  <div id="backgroundColor"></div>
  <nav id="navigationBar"></nav>

  <div id="bannerContainer">
    <img id="bannerImg" alt="Banner">
  </div>

  <div id="container"></div>

  <script src="products.js"></script>
  <style>
    *,
    *::before,
    *::after {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html {
      font-size: 6px;
      width: 100vw;
    }

    body {
      font-size: 2.6rem;
      width: 100vw;
      height: auto;
    }

    body::-webkit-scrollbar {
      display: none;
    }

    #backgroundColor {
      position: fixed;
      width: 100vw;
      height: 100vh;
      z-index: -5;
      background: linear-gradient(to right, #d7d7ff, #9292ff);
    }

    #bannerContainer {
      width: 100vw;
      height: auto;
      padding-top: 70px;
      display: flex;
      justify-content: center;
    }
    #bannerContainer img {
      width: 90vw;
      max-width: 900px;
      height: auto;
      margin-top: 30px;
    }
    #container {
      margin-top: 100px;
      width: 100vw;
      height: auto;
      justify-items: center;
    }
  </style>
</body>

</html>
