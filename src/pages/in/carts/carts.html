<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
  <div id="backgroundColor"></div>
  <nav id="navigationBar"></nav>

  <div id="cartsMainContainer"></div>
  
  <script src="carts.js"></script>
  <style>
    *,
*::before,
*::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html {
    font-size: 6px;
}
body {
    font-size: 2.6rem;
}
#backgroundColor {
    position: fixed;
    width: 100vw;
    height: 100vh;
    z-index: -5;
    background: linear-gradient(to right, #d7d7ff, #9292ff);
}
    #navigationBar {
        position: absolute;
        width: 100vw;
        height: 70px;
        background-color: #afccec;
        display: flex;
        align-items: center;
    }
    #navigationBar h1 {
        font-weight: bold;
        font-family: Arial, serif;
        left: 1rem;
        margin-left: clamp(2rem, 7vw, 20rem);
    }
    #navigationBar ul {
        right: 1rem;
        width: clamp(30rem, 40vw, 60rem);
        list-style: none;
        display: flex;
        justify-content: space-evenly;
        margin-left: auto;
    }
.listCompo {
    width: 5rem;
    text-align: center;
}
.listCompo svg {
    width: 5rem;
}

#cartsMainContainer {
    width: 95vw;
    max-width: 640px;
    height: 100vh;
    justify-self: center;
    padding-top: 80px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
  </style>
</body>
</html>
