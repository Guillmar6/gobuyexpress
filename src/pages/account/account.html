<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
  <div id="backgroundColor"></div>
  <nav id="navigationBar"></nav>
  
  <div id="outerProfileBox">
    <div id="profileBox">
      <a href="#profile">Profile</a>
      <a href="#addresses">Addresses</a>
      <a href="#change_password">Change Password</a>
    </div>
    <div id="outerMenu">
      <div class="menus one" id="menuOne" hidden>
        <div id="profileMenu">
          <div id="displayMenu">
            <h1>Profile</h1>
          </div>
          <hr>
          <div id="infosMenu">
            <form id="profileInfos">
              <div id="container">
                <div class="labelBox" id="usernameBox">
                  <label class="labelChilds" for="username">Username</label>
                  <input class="inputChilds" type="text" name="username" id="username" required>
                </div>
                <div class="labelBox" id="emailBox">
                  <label class="labelChilds" for="email">Email</label>
                  <input class="inputChilds" type="email" name="email" id="email" required>
                </div>
                <div class="labelBox" id="phone_numberBox">
                  <label class="labelChilds" for="phone_number">Phone number</label>
                  <input class="inputChilds" type="tel" name="phone_number" id="phone_number" required>
                </div>
                <div class="labelBox" id="gender">
                  <label class="labelChilds">Gender</label>
                  <label class="genderLabels"><input type="radio" name="gender" id="gender" value="male">Male</label>
                  <label class="genderLabels"><input type="radio" name="gender" id="gender" value="female">Female</label>
                </div>
                <div class="labelBox" id="birthdayBox">
                  <label class="labelChilds" for="birthday">Birthday</label>
                  <input class="inputChilds" type="date" name="birthday" id="birthday" required>
                </div>
                <div class="labelBox">
                  <div class="labelChilds"></div>
                  <input id="saveBtn" onclick="saveProfile()" type="button" value="Save">
                </div>
              </div>
              <div></div>
            </form>
          </div>
        </div>
      </div>

      <div class="menus two" id="menuTwo" hidden>
        <div id="profileMenu">
          <div id="displayMenu">
            <h1>Addresses</h1>
          </div>
          <hr>
          <div id="infosMenu">
            <form action="" method="post"></form>
          </div>
        </div>
      </div>

      <div class="menus three" id="menuThree" hidden>
        <div id="profileMenu">
          <div id="displayMenu">
            <h1>Change Password</h1>
          </div>
          <hr>
          <div id="infosMenu"></div>
        </div>
      </div>
    </div>
  </div>
  <button onclick="logout()" id="logoutBtn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M224 160C241.7 160 256 145.7 256 128C256 110.3 241.7 96 224 96L160 96C107 96 64 139 64 192L64 448C64 501 107 544 160 544L224 544C241.7 544 256 529.7 256 512C256 494.3 241.7 480 224 480L160 480C142.3 480 128 465.7 128 448L128 192C128 174.3 142.3 160 160 160L224 160zM566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L438.6 169.3C426.1 156.8 405.8 156.8 393.3 169.3C380.8 181.8 380.8 202.1 393.3 214.6L466.7 288L256 288C238.3 288 224 302.3 224 320C224 337.7 238.3 352 256 352L466.7 352L393.3 425.4C380.8 437.9 380.8 458.2 393.3 470.7C405.8 483.2 426.1 483.2 438.6 470.7L566.6 342.7z"/></svg>
    <p>Logout</p></button>


  
  <script src="account.js"></script>
  <style>
    *,
*::before,
*::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html, body {
    width: 100vw;
    height: 100vh;
}
html {
    font-size: 6px;
}
body {
    font-size: 2.6rem;
}
#backgroundColor {
    position: fixed;
    width: 100vw;
    height: 100vh;
    z-index: -5;
    background: linear-gradient(to right, #d7d7ff, #9292ff);
}
#navigationBar {
    position: absolute;
    width: 100vw;
    height: 70px;
    background-color: #afccec;
    display: flex;
    align-items: center;
}
#navigationBar h1 {
    font-weight: bold;
    font-family: Arial, serif;
    left: 1rem;
    margin-left: clamp(2rem, 7vw, 20rem);
}
#navigationBar ul {
    right: 1rem;
    width: clamp(30rem, 40vw, 60rem);
    list-style: none;
    display: flex;
    justify-content: space-evenly;
    margin-left: auto;
}
.listCompo {
    width: 5rem;
    text-align: center;
}
.listCompo svg {
    width: 5rem;
}


#outerProfileBox {
    padding-top: 70px;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: row;
}
#profileBox {
    width: clamp(200px, 50vw, 300px);
    height: 100%;
    border-right: 2px solid rgb(94, 170, 174);
    box-shadow: 0px 0px 15px rgb(106, 176, 180);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 80px;
}
#profileBox a {
    width: 150px;
    height: 30px;
    text-align: left;
    color: black;
    text-decoration-line: none;
}
#outerMenu {
    width: 100vw;
    height: 100%;
}
.menus {
    width: 100%;
    height: 100%;
}
#profileMenu {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
}
#displayMenu {
    width: 100%;
    height: 100px;
    padding: 30px;
    padding-left: 50px;
}
#profileMenu hr {
    align-self: center;
    width: 90%;
    background-color: grey;
}
#infosMenu {
    width: 100%;
    height: 100%;
}
#infosMenu form {
    width: 90%;
    height: 100%;
    justify-self: center;
}
#infosMenu #container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}
.labelBox {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: row;
}
.labelBox .labelChilds {
    height: 100%;
    width: 150px;
    padding-right: 20px;
    align-content: center;
    text-align: end;
    font-weight: bold;
    font-family: Arial, serif;
    color: rgb(102, 102, 102);
}
.labelBox .inputChilds {
    padding-left: 15px;
    align-self: center;
    width: 500px;
    height: 45px;
    border: 1px solid grey;
    border-radius: 10px;
    font-weight: bold;
    font-family: Arial, serif;
}
#gender {
    align-items: center;
}
.genderLabels {
    width: 100px;
}
#saveBtn {
    width: 70px;
    height: 40px;
    align-self: center;
    border-radius: 7px;
    background-color: rgb(255, 115, 0);
}

#logoutBtn {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    width: 80px;
    height: 50px;
    border-radius: 6px;
    background-color: rgb(255, 115, 0);
}
#logoutBtn p {
    font-size: 1.5rem;
    font-weight: bold;
}
#logoutBtn svg {
    width: 4rem;
    height: 4rem;
    margin: 0;
    padding: 0;
}

@media screen and (width>=576px) {
}

/*  My phone landscape  */
@media screen and (width>=768px) {

/*  My phone portrait  */
@media screen and (orientation: portrait) and (width>=768px) {
}
/* usually tablets*/
@media screen and (width>=992px) {
}
/*  My laptop  */
@media screen and (width>=1200px) {
}
  </style>
</body>
</html>
